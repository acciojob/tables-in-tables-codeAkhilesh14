<!DOCTYPE html>
<html>

<head>
  <title>Nested HTML Tables</title>
</head>

<body>

  <table border="1" cellspacing="0" cellpadding="5" width="700">

    <tr>

      <!-- Top Left -->
      <td height="250">

        <table border="1" cellspacing="0" cellpadding="5" width="100%">

          <tr>
            <th colspan="2">Nested Table 2</th>
          </tr>

          <tr>
            <th>Column 1</th>
            <th>Column 2</th>
          </tr>

          <tr>
            <td align="center">abc</td>
            <td align="center">def</td>
          </tr>

        </table>

      </td>

      <!-- Top Right -->
      <td>

        <table border="1" cellspacing="0" cellpadding="5" width="100%">

          <tr>
            <th>Nested Table 1</th>
          </tr>

          <tr>
            <td>
              <ul>
                <li>List item</li>
                <li>List item</li>
                <li>List item</li>
              </ul>
            </td>
          </tr>

        </table>

      </td>

    </tr>

    <tr>

      <!-- Bottom Left -->
      <td>

        <table border="1" cellspacing="0" cellpadding="5" width="100%">

          <tr>
            <th colspan="2">Nested Table 3</th>
          </tr>

          <tr>
            <td>
              <a href="#">Nested Table</a>
            </td>

            <td>
              Demo Continued
            </td>
          </tr>

        </table>

      </td>

      <!-- Bottom Right -->
      <td>

        <table border="1" cellspacing="0" cellpadding="5" width="100%">

          <tr>
            <th>Nested Table 4</th>
          </tr>

          <tr>
            <td align="center" style="background-color:black; color:white;">
              <b>HTML</b>
            </td>
          </tr>

        </table>

      </td>

    </tr>

  </table>

</body>

</html>
